<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ollama</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --card: #181818;
    --text: #ededed;
    --muted: #7a7a7a;
    --border: #262626;
    --accent: #2563eb;
    --green: #3ddc84;
    --red: #ff6058;
    --amber: #e8a317;
    --blue: #3b82f6;
    --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.4 var(--font-ui); }
  #root { padding: 10px 12px 16px; min-height: 100%; }
  .status { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .status strong { font-size: 12px; }
  .graph { margin: 0 0 12px; }
  .graph-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-bottom: 4px; }
  .graph-head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  svg { width: 100%; height: 48px; display: block; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; color: var(--muted); }
  .err { color: var(--red); }
</style>
</head>
<body>
<div id="root">Loading live stats…</div>
<script>
(function () {
  var CHANNEL = "uefn-plugin-ui";
  var samples = [];
  var live = null;

  function call(method, params) {
    var id = crypto.randomUUID();
    return new Promise(function (resolve, reject) {
      var timer = window.setTimeout(function () {
        window.removeEventListener("message", onMsg);
        reject(new Error("Timed out talking to Ollama plugin"));
      }, 15000);
      function onMsg(ev) {
        var d = ev.data;
        if (!d || d.channel !== CHANNEL || d.id !== id) return;
        window.clearTimeout(timer);
        window.removeEventListener("message", onMsg);
        if (d.ok) resolve(d.result);
        else reject(new Error(d.error || "bridge error"));
      }
      window.addEventListener("message", onMsg);
      parent.postMessage({ channel: CHANNEL, id: id, method: method, params: params || {} }, "*");
    });
  }
  function rpc(method, params) {
    return call("plugin.call", { method: method, params: params || {} });
  }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function applyTheme(vars) {
    if (!vars || typeof vars !== "object") return;
    Object.keys(vars).forEach(function (k) {
      if (vars[k] == null || vars[k] === "") return;
      document.documentElement.style.setProperty("--" + k, String(vars[k]));
    });
  }
  function areaChart(pts, colorVar, ceiling) {
    if (!pts.length) return '<svg viewBox="0 0 100 40"></svg>';
    var max = ceiling || Math.max.apply(null, pts.concat([1]));
    var step = pts.length > 1 ? 100 / (pts.length - 1) : 100;
    var line = pts.map(function (v, i) {
      return (i * step).toFixed(1) + "," + (38 - (Number(v) / max) * 34).toFixed(1);
    }).join(" ");
    var fill = "0,40 " + pts.map(function (v, i) {
      return (i * step).toFixed(1) + "," + (38 - (Number(v) / max) * 34).toFixed(1);
    }).join(" ") + " 100,40";
    var c = colorVar || "--accent";
    return '<svg viewBox="0 0 100 40" preserveAspectRatio="none">' +
      '<polygon fill="color-mix(in srgb, var(' + c + ') 28%, transparent)" points="' + fill + '" />' +
      '<polyline fill="none" stroke="var(' + c + ')" stroke-width="1.6" stroke-linejoin="round" points="' + line + '" /></svg>';
  }
  function graph(label, readout, pts, colorVar, ceiling) {
    return '<div class="graph"><div class="graph-head"><span>' + esc(label) +
      "</span><span>" + esc(readout) + "</span></div>" +
      areaChart(pts, colorVar, ceiling) + "</div>";
  }
  function series(key) {
    return samples.map(function (s) { return s[key] == null ? 0 : s[key]; });
  }
  function render() {
    var el = document.getElementById("root");
    if (!el) return;
    if (!live) {
      el.innerHTML = '<p class="err">Waiting for live stats…</p>';
      return;
    }
    if (!live.ok && live.error) {
      el.innerHTML = '<p class="err">' + esc(live.error) + "</p>";
    }
    var runNote = live.thinking
      ? "Thinking · " + (live.generating_model || "")
      : live.running ? "Warm" : "Idle";
    var vramPct = live.vram_total ? (100 * (live.vram_used || 0)) / live.vram_total : live.gpu_pct || 0;
    var loaded = (live.models || []).map(function (m) {
      return '<div class="meta"><span>' + esc(m.name) + "</span><span>" +
        esc(m.size_vram_label || "") + " VRAM</span></div>";
    }).join("");
    el.innerHTML =
      '<div class="status"><span>' + esc(runNote) + "</span><strong>" +
      esc(live.gpu_name || "PC") + "</strong></div>" +
      graph("CPU" + (live.cpu_count ? " · " + live.cpu_count + "c" : ""), live.cpu_pct != null ? live.cpu_pct + "%" : "n/a", series("cpu_pct"), "--accent", 100) +
      graph("RAM", live.ram_label || "n/a", series("ram_pct"), "--amber", 100) +
      graph("GPU", live.gpu_pct != null ? live.gpu_pct + "%" : "n/a", series("gpu_pct"), "--green", 100) +
      graph("VRAM", live.vram_label || "n/a", series("vram_pct").length ? series("vram_pct") : samples.map(function () { return vramPct; }), "--red", 100) +
      graph("Disk", live.disk_label || "n/a", series("disk_pct"), "--blue", 100) +
      (live.gpu_temp != null ? graph("GPU temp", live.gpu_temp + "°C", series("gpu_temp"), "--amber", 100) : "") +
      (live.gpu_power != null ? graph("Power", live.gpu_power + " W" + (live.gpu_power_limit ? " / " + live.gpu_power_limit : ""), series("gpu_power"), "--accent") : "") +
      (live.gpu_fan != null ? graph("Fan", live.gpu_fan + "%", series("gpu_fan"), "--muted", 100) : "") +
      (live.gpu_clock != null ? '<div class="meta"><span>Clock</span><span>' + live.gpu_clock + " MHz</span></div>" : "") +
      (loaded || '<p style="color:var(--muted)">No model in VRAM.</p>');
  }
  function tick() {
    return rpc("stats.live", {}).then(function (res) {
      live = res || { ok: false };
      if (live && live.ok && live.vram_total) {
        live.vram_pct = (100 * (live.vram_used || 0)) / live.vram_total;
      }
      if (live && live.ok) samples = samples.concat([live]).slice(-36);
      render();
    }).catch(function (err) {
      live = { ok: false, error: String(err && err.message ? err.message : err) };
      render();
    });
  }
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.channel !== CHANNEL || !d.event) return;
    if (d.event.type === "appearance_theme") applyTheme(d.event.vars);
  });
  call("theme.get").then(function (res) {
    if (res && res.vars) applyTheme(res.vars);
  }).catch(function () {});
  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
